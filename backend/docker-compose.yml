services:
  postgres:
    image: postgres:16-alpine
    container_name: ateliux-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ateliux
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ateliux_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ateliux"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ateliux-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ateliux_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ateliux-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3001:3001"
    command: npm run start:dev
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  ateliux_postgres_data:
  ateliux_redis_data:
